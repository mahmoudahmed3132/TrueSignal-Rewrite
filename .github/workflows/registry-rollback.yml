#
# Registry rollback (§10, manual): marks the latest version of a sensor
# deprecated. Hubs stop offering it for new deployments and stop counting it
# as "latest"; the previous non-deprecated version becomes latest. Nothing is
# deleted (versions are immutable). The registry branch is in the public
# releases repository (<owner>/truesignal-releases).
name: registry-rollback

on:
  workflow_dispatch:
    inputs:
      sensor:
        description: Sensor name whose latest version is deprecated
        required: true
        type: string
      confirm:
        description: Type the sensor name again to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: registry-rollback
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    permissions:
      contents: read    # the registry is pushed to the releases repository with the App token
    env:
      RELEASES_REPO: ${{ github.repository_owner }}/truesignal-releases
      SENSOR: ${{ inputs.sensor }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: validate input
        run: |
          echo "$SENSOR" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$' || { echo "::error::invalid sensor name"; exit 1; }
          [ "$SENSOR" = "$CONFIRM" ] || { echo "::error::confirmation does not match"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: "**/go.sum"
      - run: cd hub && go build -o "$RUNNER_TEMP/ts-registry" ./cmd/ts-registry
      - id: releases-token
        name: token for the public releases repository (GitHub App, contents:write on that repository only)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASES_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: truesignal-releases
          permission-contents: write
      - name: deprecate and push to the releases repository (retry on conflict)
        env:
          RELEASES_TOKEN: ${{ steps.releases-token.outputs.token }}
        run: |
          . scripts/release/releases-auth.sh
          REGISTRY_REMOTE="$RELEASES_URL" scripts/release/registry-commit.sh "registry: deprecate latest $SENSOR (rollback by $GITHUB_ACTOR)" \
            "$RUNNER_TEMP/ts-registry" deprecate -dir . -name "$SENSOR"
