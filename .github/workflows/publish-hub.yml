#
# Hub publish (§10). Tag hub/vX.Y.Z -> image built (UI embedded), scanned,
# pushed to GHCR by digest, signed keyless with cosign, verified, released in
# the public releases repository (<owner>/truesignal-releases; this
# repository is private), where the Hub's update check reads it.
# Then a serialised job (one concurrency group across all Hub tags) moves
# :latest to the highest published, signature-verified version.
name: publish-hub

on:
  push:
    tags: ["hub/v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.26.10"
  ISSUER: https://token.actions.githubusercontent.com
  RELEASES_REPO: ${{ github.repository_owner }}/truesignal-releases

jobs:
  guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        name: tag matches code version, is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/release/check-tag.sh "$GITHUB_REF_NAME" "$DEFAULT_BRANCH" | tee -a "$GITHUB_OUTPUT"
      - id: image
        run: echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/ts-hub" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: refuse an already published version
        env:
          REF: ${{ steps.image.outputs.image }}:${{ steps.tag.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>err.txt; then
            echo "::error::$REF already exists; published versions are never rebuilt"; exit 1
          fi
          grep -qiE 'not found|manifest unknown|name unknown' err.txt || { cat err.txt; echo "::error::cannot determine whether $REF exists"; exit 1; }

  build:
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      IMAGE: ${{ needs.guard.outputs.image }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-hub.yml@${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: build the admin UI (embedded by go:embed)
        run: make ui
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: build for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ env.VERSION }}
          load: true
          push: false
          tags: scan/ts-hub:${{ env.VERSION }}
      - name: scan (fixable HIGH/CRITICAL fail before anything is pushed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: scan/ts-hub:${{ env.VERSION }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - id: push
        name: build and push (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: sign by digest (keyless) and verify
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::no digest from the push"; exit 1; }
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" >/dev/null
          echo "signed $IMAGE@$DIGEST"

  release:
    needs: [guard, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read    # the release is created in the releases repository with the App token
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      IMAGE: ${{ needs.guard.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-hub.yml@${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: releases-token
        name: token for the public releases repository (GitHub App, contents:write on that repository only)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASES_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: truesignal-releases
          permission-contents: write
      - name: create the release in the public releases repository (notes vs the previous Hub tag)
        env:
          RELEASES_TOKEN: ${{ steps.releases-token.outputs.token }}
        run: |
          scripts/release/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<NOTES

          ### Image
          \`$IMAGE:$VERSION@$DIGEST\` (linux/amd64, linux/arm64)

          \`\`\`sh
          cosign verify $IMAGE@$DIGEST \\
            --certificate-identity $IDENTITY \\
            --certificate-oidc-issuer $ISSUER
          \`\`\`
          Pin the digest in deploy/compose.yaml. Upgrade and rollback: docs/operations.md.
          NOTES
          scripts/release/publish-release.sh "$GITHUB_REF_NAME" "Hub v$VERSION" notes.md

  latest:
    needs: [guard, release]
    runs-on: ubuntu-24.04
    concurrency:
      group: hub-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.guard.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: install crane (module checksum verified via sum.golang.org)
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: move :latest to the highest verified release
        run: scripts/release/hub-latest.sh "$IMAGE" "$GITHUB_REPOSITORY"
