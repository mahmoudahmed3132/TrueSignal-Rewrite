#
# CLI publish (§10, Q46). Tag cli/vX.Y.Z -> static linux/amd64 and arm64
# binaries, SHA256SUMS, one Sigstore bundle per binary (keyless, this
# workflow's identity at the tag), GitHub release in the public releases
# repository (<owner>/truesignal-releases). install.sh verifies exactly
# this identity, so the file name of this workflow is part of the contract.
name: publish-cli

on:
  push:
    tags: ["cli/v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.10"
  RELEASES_REPO: ${{ github.repository_owner }}/truesignal-releases

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        name: tag matches code version, is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/release/check-tag.sh "$GITHUB_REF_NAME" "$DEFAULT_BRANCH" | tee -a "$GITHUB_OUTPUT"
      - name: refuse an already published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh release view "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --json assets --jq '.assets | length' 2>&1); then
            if [ "$out" -gt 0 ]; then
              echo "::error::$GITHUB_REF_NAME already has $out release assets; published versions are never rebuilt"
              exit 1
            fi
          elif ! echo "$out" | grep -qi "release not found"; then
            echo "::error::cannot determine whether $GITHUB_REF_NAME is published: $out"
            exit 1
          fi

  publish:
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read    # the release is created in the releases repository with the App token
      id-token: write   # Sigstore keyless signing
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-cli.yml@${{ github.ref }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: build static binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd cli && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOWORK=off \
              go build -trimpath -ldflags "-s -w -buildid= -X main.Version=$VERSION" -o "../dist/truesignal-linux-$arch" ./cmd/truesignal)
            file "dist/truesignal-linux-$arch" | grep -q "statically linked" || { echo "::error::$arch binary is not static"; exit 1; }
          done
          ./dist/truesignal-linux-amd64 version | grep -F "$VERSION"
          (cd dist && sha256sum truesignal-linux-amd64 truesignal-linux-arm64 > SHA256SUMS && cat SHA256SUMS)
      - name: sign and verify (Sigstore keyless)
        run: |
          for arch in amd64 arm64; do
            f="dist/truesignal-linux-$arch"
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$f"
          done
      - name: the installer accepts these assets (checksum + signature)
        run: |
          sh install.sh --version "$VERSION" --base-url "file://$PWD/dist" --prefix "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/truesignal" version | grep -F "$VERSION"
      - id: releases-token
        name: token for the public releases repository (GitHub App, contents:write on that repository only)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASES_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: truesignal-releases
          permission-contents: write
      - name: create the release in the public releases repository
        env:
          RELEASES_TOKEN: ${{ steps.releases-token.outputs.token }}
        run: |
          scripts/release/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<NOTES

          ### Install and verify
          \`\`\`sh
          curl -fsSLO https://raw.githubusercontent.com/$RELEASES_REPO/$GITHUB_REF_NAME/install.sh
          sudo sh install.sh --version $VERSION --sha256 <hash from SHA256SUMS>
          # manual check:
          sha256sum -c SHA256SUMS --ignore-missing
          cosign verify-blob --bundle truesignal-linux-amd64.sigstore.json \\
            --certificate-identity $IDENTITY \\
            --certificate-oidc-issuer $ISSUER truesignal-linux-amd64
          \`\`\`
          NOTES
          scripts/release/publish-release.sh --install-sh install.sh "$GITHUB_REF_NAME" "CLI v$VERSION" notes.md \
            dist/truesignal-linux-amd64 dist/truesignal-linux-arm64 dist/SHA256SUMS \
            dist/truesignal-linux-amd64.sigstore.json dist/truesignal-linux-arm64.sigstore.json
