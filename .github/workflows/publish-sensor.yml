#
# Sensor publish (§10). Tag sensor/<name>/vX.Y.Z -> image built, scanned,
# pushed and signed; manifest pinned to the pushed digest, validated with the
# Hub's production rules, signed (detached Sigstore bundle) and committed to
# the registry branch of the public releases repository
# (<owner>/truesignal-releases; this repository is private) with a
# regenerated index.json. Concurrent sensor publishes retry the registry push
# on conflict.
# Signing identity (consumed by the PORTED verifier):
#   https://github.com/<repo>/.github/workflows/publish-sensor.yml@refs/tags/sensor/<name>/v<version>
name: publish-sensor

on:
  push:
    tags: ["sensor/*/v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.10"
  ISSUER: https://token.actions.githubusercontent.com
  RELEASES_REPO: ${{ github.repository_owner }}/truesignal-releases

jobs:
  guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      name: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        name: tag matches manifest version, is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/release/check-tag.sh "$GITHUB_REF_NAME" "$DEFAULT_BRANCH" | tee -a "$GITHUB_OUTPUT"
      - id: image
        env:
          NAME: ${{ steps.tag.outputs.name }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/ts-sensor-$NAME"
          [ "$(jq -r .image.repository "sensors/$NAME/manifest.json")" = "$image" ] ||
            { echo "::error::manifest image.repository must be $image"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: refuse a version already in the registry
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          (cd hub && go build -o "$RUNNER_TEMP/ts-registry" ./cmd/ts-registry)
          # The registry branch lives in the public releases repository (read anonymously).
          url="https://github.com/$RELEASES_REPO.git"
          set +e; git ls-remote --exit-code --heads "$url" refs/heads/registry >/dev/null; rc=$?; set -e
          if [ "$rc" -eq 0 ]; then
            git fetch --quiet --no-tags "$url" +refs/heads/registry:refs/remotes/releases/registry
            git worktree add --quiet --detach "$RUNNER_TEMP/reg" refs/remotes/releases/registry
            set +e; "$RUNNER_TEMP/ts-registry" published -dir "$RUNNER_TEMP/reg" -name "$NAME" -version "$VERSION"; rc=$?; set -e
            [ "$rc" -eq 3 ] || { echo "::error::$NAME@$VERSION is already in the registry (or the check failed: $rc)"; exit 1; }
          elif [ "$rc" -ne 2 ]; then
            echo "::error::cannot read the registry branch of $RELEASES_REPO (git exit $rc)"; exit 1
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: refuse an existing image tag (immutable; never overwritten)
        env:
          REF: ${{ steps.image.outputs.image }}:${{ steps.tag.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>err.txt; then
            echo "::error::$REF exists but the version is not in the registry: a previous run failed after pushing. Investigate; delete the package version deliberately before re-running."
            exit 1
          fi
          grep -qiE 'not found|manifest unknown|name unknown' err.txt || { cat err.txt; echo "::error::cannot determine whether $REF exists"; exit 1; }

  publish:
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read    # the registry is pushed to the releases repository with the App token
      packages: write
      id-token: write
    env:
      NAME: ${{ needs.guard.outputs.name }}
      VERSION: ${{ needs.guard.outputs.version }}
      IMAGE: ${{ needs.guard.outputs.image }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-sensor.yml@${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - run: cd hub && go build -o "$RUNNER_TEMP/ts-registry" ./cmd/ts-registry
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: build for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sensors/${{ env.NAME }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: scan/ts-sensor:${{ env.VERSION }}
      - name: scan (fixable HIGH/CRITICAL fail before anything is pushed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: scan/ts-sensor:${{ env.VERSION }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - id: push
        name: build and push (linux/amd64, as declared in the manifest)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sensors/${{ env.NAME }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: sign the image; pin, validate and sign the manifest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::no digest from the push"; exit 1; }
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" >/dev/null
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          "$RUNNER_TEMP/ts-registry" fill -in "sensors/$NAME/manifest.json" -out "$out/manifest.json" \
            -name "$NAME" -version "$VERSION" -repository "$IMAGE" -tag "$VERSION" -digest "$DIGEST"
          cosign sign-blob --yes --bundle "$out/manifest.json.sigstore.json" "$out/manifest.json"
          cosign verify-blob --bundle "$out/manifest.json.sigstore.json" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$out/manifest.json"
      - id: releases-token
        name: token for the public releases repository (GitHub App, contents:write on that repository only)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASES_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: truesignal-releases
          permission-contents: write
      - name: commit to the registry branch of the releases repository (retry on conflict)
        env:
          RELEASES_TOKEN: ${{ steps.releases-token.outputs.token }}
        run: |
          . scripts/release/releases-auth.sh
          REGISTRY_REMOTE="$RELEASES_URL" scripts/release/registry-commit.sh "registry: $NAME $VERSION" \
            "$GITHUB_WORKSPACE/scripts/release/registry-add.sh" "$RUNNER_TEMP/ts-registry" "$NAME" "$VERSION" "$RUNNER_TEMP/out"
